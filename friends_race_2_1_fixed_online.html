<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRIENDS RACE — Online</title>
</head>
<body>
<script>
(async()=>{
  const source="https://raw.githubusercontent.com/Ilnur-hash/game-for-Boratya/main/friends_race_2_1_fixed.html";
  try{
    const r=await fetch(source,{cache:"no-store"});
    if(!r.ok) throw new Error("Не удалось загрузить игру: HTTP "+r.status);
    let html=await r.text();

    // Гонка использует отдельную таблицу Supabase.
    html=html.replaceAll('bonk_scores','race_scores');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML=
      '<div style="font-family:system-ui;padding:24px">'+
      '<h2>Не удалось загрузить гонку</h2>'+
      '<p>'+String(e.message||e)+'</p>'+
      '<p>Проверь интернет-соединение и обнови страницу.</p>'+
      '</div>';
  }
})();
</script>
</body>
</html>
